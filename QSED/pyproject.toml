[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-image-edge-detection"
version = "1.0.0"
description = "Quantum image edge detection based on eight-direction Sobel operator for NEQR"
readme = "README.md"
authors = [
    { name = "Wenjie Liu" },
    { name = "Lu Wang" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "qiskit>=1.0.0",
    "qiskit-aer>=0.14.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "pillow>=9.5.0",
    "scipy>=1.10.0",
    "tqdm>=4.65.0",
    "scikit-image>=0.20.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.0",
    "jupyter>=1.0.0"
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
